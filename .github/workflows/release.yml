name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

env:
  HUSKY: "0"

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: "Guard: skip if template not yet instantiated"
        id: guard
        run: |
          if grep -rq '{{' package.json .releaserc.* release.config.* src/app/page.tsx 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Unresolved template placeholders detected. Skipping release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Release
        if: steps.guard.outputs.skip == 'false'
        run: npx semantic-release
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  packages: write

env:
  HUSKY: "0"
  DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  CDN_DOMAIN: ${{ vars.CDN_DOMAIN }}

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Guard — skip if template not yet instantiated
        id: guard
        run: |
          if grep -rq '{{' package.json .releaserc.* release.config.* src/app/page.tsx 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  Unresolved template placeholders detected — skipping release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.guard.outputs.skip == 'false'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.guard.outputs.skip == 'false'
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: steps.guard.outputs.skip == 'false'
        run: gcloud auth configure-docker "$(echo "$DOCKER_REGISTRY" | cut -d/ -f1)" --quiet

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: npm ci

      - name: Release
        if: steps.guard.outputs.skip == 'false'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
